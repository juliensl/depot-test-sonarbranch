<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Code de la GitHub App</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --code-bg: #f6f8fa; --border: #d1d9e0; --warn: #9a6700; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --code-bg: #151b23; --border: #3d444d; --warn: #d29922; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  #code { display: block; margin: 16px 0; padding: 20px; font: 600 2rem/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; word-break: break-all; user-select: all; }
  p { color: var(--muted); }
  .warn { color: var(--warn); }
</style>
</head>
<body>
<main>
  <h1>Copiez ce code dans le chat</h1>
  <code id="code">(aucun code reçu)</code>
  <p>Ce code ne sert qu'une fois et expire une heure après la création de l'App.</p>
  <p class="warn" id="err" hidden></p>
</main>
<script>
  // Shows the one-time manifest conversion code returned by GitHub.
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  if (code) document.getElementById("code").textContent = code;
  if (params.get("error")) {
    const e = document.getElementById("err");
    e.hidden = false;
    e.textContent = "GitHub a renvoyé une erreur : " + params.get("error");
  }
</script>
</body>
</html>
